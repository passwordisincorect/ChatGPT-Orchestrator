name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Compile
        run: python -m compileall -q src tests scripts

      - name: Dependency check
        run: python -m pip check

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: MCP surface check
        shell: pwsh
        run: |
          @'
          import asyncio
          from chatgpt_orchestrator.server import mcp

          async def main():
              tools = await mcp.list_tools()
              assert len(tools) == 19, len(tools)

          asyncio.run(main())
          '@ | python -
